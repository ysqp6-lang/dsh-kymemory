# Mount the layered-memory plugin in any DSH profile that installs this package.
# `insert` adds this plugin's row; `name` resolves through the profile's node_modules.
# Memory root, index limits and injection order are configured in the profile's own
# cordis.patch.yml config block (see README.zh.md), not here.
- insert:
    - id: dsh-kymemory
      name: dsh-kymemory
